name: main
on:
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      has_lint: ${{ steps.plan.outputs.has_lint }}
      has_images: ${{ steps.plan.outputs.has_images }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      has_release: ${{ steps.plan.outputs.has_release }}
      lint_matrix: ${{ steps.plan.outputs.lint_matrix }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      test_matrix: ${{ steps.plan.outputs.test_matrix }}
      plan_artifact: ${{ format('{0}-{1}-{2}', steps.plan.outputs.plan_artifact, github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        uses: tdesaules/github-actions/workflow/plan-atomic-release@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          event: ${{ github.event_name }}
          ref: ${{ github.ref }}
          before: ${{ github.event.before }}
          repository: ${{ github.repository }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ format('{0}-{1}-{2}', steps.plan.outputs.plan_artifact, github.run_id, github.run_attempt) }}
          path: .build/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  lint:
    needs: check
    if: ${{ needs.check.result == 'success' && needs.check.outputs.has_lint == 'true' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.lint_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          persist-credentials: false
      - if: matrix.id == 'actionlint'
        uses: tdesaules/github-actions/lint/actionlint@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          files: ${{ toJSON(matrix.files) }}
      - if: matrix.id == 'yaml'
        uses: tdesaules/github-actions/lint/yaml@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          files: ${{ toJSON(matrix.files) }}
      - if: matrix.id == 'toml'
        uses: tdesaules/github-actions/lint/toml@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          files: ${{ toJSON(matrix.files) }}
      - if: matrix.id == 'shellcheck'
        uses: tdesaules/github-actions/lint/shellcheck@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          files: ${{ toJSON(matrix.files) }}
      - if: matrix.id == 'markdownlint'
        uses: tdesaules/github-actions/lint/markdownlint@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          files: ${{ toJSON(matrix.files) }}
  build:
    needs: [check, lint]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
          needs.check.outputs.has_images == 'true' &&
          ((needs.check.outputs.has_lint == 'true' && needs.lint.result == 'success') ||
           (needs.check.outputs.has_lint == 'false' && needs.lint.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          persist-credentials: false
      - id: render
        uses: tdesaules/github-actions/workflow/render-bluebuild@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        env:
          # Render Docker mount syntax for the downstream BuildKit constructor.
          BB_BUILD_DRIVER: docker
        with:
          directory: .
          recipe: recipes/recipe.yml
          output: .build/Containerfile
          repository: ghcr.io/niri-tonic/niri-tomic-os
          platform: linux/${{ matrix.arch }}
      - id: image
        # Approved Atomic-only BuildKit/socket exception; exports without pushing.
        uses: tdesaules/github-actions/workflow/build-atomic-image@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          context: .
          containerfile: ${{ steps.render.outputs.containerfile }}
          image: ghcr.io/niri-tonic/niri-tomic-os
          version: ${{ needs.check.outputs.version }}
          platform: linux/${{ matrix.arch }}
          labels: >-
            {"org.opencontainers.image.revision":"${{ needs.check.outputs.source_sha }}",
             "org.opencontainers.image.source":"https://github.com/${{ github.repository }}",
             "org.opencontainers.image.version":"${{ needs.check.outputs.version }}"}
          output: .build/candidate/image.oci.tar
      - uses: tdesaules/github-actions/workflow/new-build-receipt@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          archive: .build/candidate/image.oci.tar
          expected-sha256: ${{ steps.image.outputs.archive-sha256 }}
          output: .build/candidate/build-receipt.json
          image: os
          architecture: ${{ matrix.arch }}
          revision: ${{ needs.check.outputs.source_sha }}
          version: ${{ needs.check.outputs.version }}
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-os-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/candidate/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Confirm uploaded candidate is visible before dependent jobs
        uses: tdesaules/github-actions/workflow/get-atomic-artifact@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          workflow-sha: ${{ github.sha }}
          max-attempt: ${{ github.run_attempt }}
          kind: candidate
          architecture: ${{ matrix.arch }}
          expected-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          token: ${{ github.token }}
  test:
    needs: [check, lint, build]
    permissions:
      contents: read
      actions: read
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
          needs.check.outputs.has_tests == 'true' &&
          ((needs.check.outputs.has_lint == 'true' && needs.lint.result == 'success') ||
           (needs.check.outputs.has_lint == 'false' && needs.lint.result == 'skipped')) &&
          ((needs.check.outputs.has_images == 'true' && needs.build.result == 'success') ||
           (needs.check.outputs.has_images == 'false' && needs.build.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.source_sha }}
          persist-credentials: false
      - id: candidate
        uses: tdesaules/github-actions/workflow/get-atomic-artifact@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          workflow-sha: ${{ github.sha }}
          max-attempt: ${{ github.run_attempt }}
          kind: candidate
          architecture: ${{ matrix.arch }}
          token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          path: .build/qualified/${{ matrix.arch }}
      - id: integrity
        uses: tdesaules/github-actions/workflow/test-build-artifact@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          archive: .build/qualified/${{ matrix.arch }}/image.oci.tar
          receipt: .build/qualified/${{ matrix.arch }}/build-receipt.json
          image: os
          architecture: ${{ matrix.arch }}
          revision: ${{ needs.check.outputs.source_sha }}
          version: ${{ needs.check.outputs.version }}
      - id: qualify
        uses: tdesaules/github-actions/check/test-atomic-image@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          archive: .build/qualified/${{ matrix.arch }}/image.oci.tar
          sha256: ${{ steps.integrity.outputs.archive-sha256 }}
          revision: ${{ needs.check.outputs.source_sha }}
          architecture: ${{ matrix.arch }}
          fedora-version: '45'
          version: ${{ needs.check.outputs.version }}
          output: .build/qualified/${{ matrix.arch }}/qualification.json
      - id: sbom
        timeout-minutes: 30
        continue-on-error: true
        uses: tdesaules/github-actions/oci/new-atomic-sbom@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          archive: ${{ steps.qualify.outputs.archive }}
          sha256: ${{ steps.qualify.outputs.sha256 }}
          architecture: ${{ matrix.arch }}
          revision: ${{ needs.check.outputs.source_sha }}
          output: .build/security/sbom.spdx.json
          binding: .build/security/sbom.spdx.json.binding.json
      - id: scan
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        timeout-minutes: 15
        continue-on-error: true
        uses: tdesaules/github-actions/oci/test-vulnerabilities@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          sbom: .build/security/sbom.spdx.json
          fail-on: none
          output: .build/security/grype.json
      - if: ${{ !cancelled() }}
        continue-on-error: true
        uses: tdesaules/github-actions/workflow/summarize-security@816accfb927cf1da23bbf5be51efa6f0a0639b38 # 1.8.1
        with:
          subject: ${{ steps.qualify.outputs.sha256 || format('git:{0}', needs.check.outputs.source_sha) }}
          sbom-outcome: ${{ steps.sbom.outcome }}
          scan-outcome: ${{ steps.scan.outcome }}
          sbom: .build/security/sbom.spdx.json
          report: .build/security/grype.json
      - if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-os-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/security/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Recheck exact candidate after tests and scans
        uses: tdesaules/github-actions/workflow/test-build-artifact@211bdb660789b484f8af7d086ad216fad9e4da08 # 1.8.0
        with:
          archive: .build/qualified/${{ matrix.arch }}/image.oci.tar
          receipt: .build/qualified/${{ matrix.arch }}/build-receipt.json
          image: os
          architecture: ${{ matrix.arch }}
          revision: ${{ needs.check.outputs.source_sha }}
          version: ${{ needs.check.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-os-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/qualified/${{ matrix.arch }}/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
