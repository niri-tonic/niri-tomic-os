name: Build Fedora 45 candidate

on:
  workflow_dispatch:
    inputs:
      push:
        description: Publish the signed candidate to its dedicated GHCR package
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Fedora 45 candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build candidate image
        uses: blue-build/github-action@v1.11
        with:
          recipe: recipe-fedora45.yml
          push: ${{ inputs.push }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
